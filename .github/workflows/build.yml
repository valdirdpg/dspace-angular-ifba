name: CI Code Validation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
      fail-fast: false

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get Yarn cache directory
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      # Validar se as dependências sobem sem conflitos de versões no yarn.lock
      - name: Validate dependencies (yarn install)
        run: yarn install --frozen-lockfile

      # Validar linting e sintaxe do código
      - name: Check code linting
        run: yarn run lint --quiet

      # Validar se não há dependências circulares quebradas
      - name: Check circular dependencies
        run: yarn run check-circ-deps

      # Validar se o projeto Angular compila em produção sem erros de tipos/templates
      - name: Run Angular Build Check
        run: yarn run build:prod